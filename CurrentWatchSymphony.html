<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLEE Quant — Symphony Watch</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1120; --card: #111827; --card2: #131f35;
    --text: #f1f5f9; --muted: #94a3b8; --border: #1f2937;
    --gold: #f59e0b; --green: #4ade80; --red: #f87171; --blue: #60a5fa;
    --shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }

  /* ── Access tier note (change BLEE_REQUIRED_TIER below to open to more users) ── */

  .page-header {
    background: linear-gradient(135deg, #0d1829 0%, #111827 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 24px;
  }
  .page-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .page-header h1 span { color: var(--gold); }
  .page-header .sub {
    color: var(--muted); font-size: 13px; margin-top: 5px;
  }
  .page-header .updated {
    font-size: 11px; color: #475569; margin-top: 4px;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }

  /* ── Symphony card ── */
  .sym-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 28px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .sym-header {
    background: var(--card2); padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .sym-name { font-size: 15px; font-weight: 700; line-height: 1.4; max-width: 600px; }
  .sym-id   { font-size: 10px; color: #475569; font-family: monospace; margin-top: 3px; }
  .sym-meta { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .meta-stat { text-align: right; }
  .meta-stat .ml { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .meta-stat .mv { font-size: 18px; font-weight: 800; }

  .sym-body {
    display: grid; grid-template-columns: 220px 1fr;
    gap: 0;
  }
  @media (max-width: 720px) {
    .sym-body { grid-template-columns: 1fr; }
    .chart-col { border-right: none; border-bottom: 1px solid var(--border); }
  }

  .chart-col {
    padding: 20px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .chart-col canvas { max-width: 180px; max-height: 180px; }
  .chart-label { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }

  .table-col { padding: 0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: rgba(255,255,255,0.03); }
  th {
    padding: 10px 16px; text-align: left; font-size: 10px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  th.r, td.r { text-align: right; }
  td { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(255,255,255,0.025); }
  .ticker-badge {
    display: inline-block; background: rgba(96,165,250,0.15);
    color: var(--blue); padding: 2px 8px; border-radius: 5px;
    font-weight: 700; font-size: 12px; letter-spacing: 0.04em;
  }
  .bar-wrap { position: relative; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; min-width: 80px; }
  .bar-fill  { height: 100%; border-radius: 3px; }

  .rebalance-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 5px; font-weight: 600;
  }
  .badge-today { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-old   { background: rgba(148,163,184,0.1);  color: var(--muted); }

  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); margin-bottom: 16px;
  }
  .total-row { font-size: 13px; color: var(--muted); padding: 8px 24px 16px; }
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="nav.js"></script>
<!-- ┌─────────────────────────────────────────────────────────────────┐
     │  ACCESS CONTROL — change "admin" to "manager", "premium", etc  │
     │  to open this page to more user tiers in the future            │
     └─────────────────────────────────────────────────────────────────┘ -->
<script>const BLEE_REQUIRED_TIER = "admin";</script>
<script src="auth_guard.js"></script>
</head>
<body>

<div class="page-header">
  <h1>🎼 Symphony <span>Watch</span></h1>
  <div class="sub">Daily allocation snapshot across all tracked Composer symphonies</div>
  <div class="updated" id="updated-line">Updated —</div>
</div>

<div class="container">
  <div id="sym-list"></div>
</div>

<script>
// ── Embedded data — regenerated daily by composer_pull_allocation.py ─────────
const SYMPHONIES = /* __SYMPHONY_DATA__ */ [{"id": "qjmHJ3IR19kmaAlbgkNj", "name": "BLEE - 187 2026 SGOV Bond 20% Yield and Min Dual Reversal", "value": 5155.58, "last_rebalance": null, "return_pct": null, "annualized": null, "holdings": [{"ticker": "QQQ", "pct": 8.04, "price": 735.595, "shares": 0.5634, "value": 414.46}, {"ticker": "GLDM", "pct": 9.11, "price": 88.99, "shares": 5.2752, "value": 469.44}, {"ticker": "SGOV", "pct": 82.69, "price": 100.65, "shares": 42.3566, "value": 4263.19}, {"ticker": "$USD", "pct": 0.16, "price": 1.0, "shares": 8.5, "value": 8.5}]}, {"id": "ZGersOlsQFRHg7U2qnSw", "name": "BLEE - 185 2026 SGOV and Dual Reversal", "value": 1032.91, "last_rebalance": null, "return_pct": null, "annualized": null, "holdings": [{"ticker": "GLDM", "pct": 8.79, "price": 88.99, "shares": 1.02, "value": 90.77}, {"ticker": "SGOV", "pct": 80.09, "price": 100.65, "shares": 8.2196, "value": 827.3}, {"ticker": "TQQQ", "pct": 10.2, "price": 83.715, "shares": 1.258, "value": 105.31}, {"ticker": "$USD", "pct": 0.92, "price": 1.0, "shares": 9.53, "value": 9.53}]}, {"id": "g7WBkfIc6UWUWC6NiAdu", "name": "BLEE A - 186 Part 1 Kei 90% NVDA", "value": 6267.99, "last_rebalance": null, "return_pct": null, "annualized": null, "holdings": [{"ticker": "UPRO", "pct": 3.32, "price": 148.32, "shares": 1.4029, "value": 208.08}, {"ticker": "SVXY", "pct": 3.65, "price": 54.75, "shares": 4.1735, "value": 228.5}, {"ticker": "TECL", "pct": 22.38, "price": 230.14, "shares": 6.0965, "value": 1403.05}, {"ticker": "TQQQ", "pct": 34.53, "price": 83.715, "shares": 25.8518, "value": 2164.19}, {"ticker": "SHV", "pct": 6.37, "price": 110.355, "shares": 3.6168, "value": 399.13}, {"ticker": "GLD", "pct": 19.79, "price": 412.98, "shares": 3.0036, "value": 1240.41}, {"ticker": "VGT", "pct": 7.14, "price": 118.9633, "shares": 3.7622, "value": 447.56}, {"ticker": "TMV", "pct": 2.09, "price": 38.3986, "shares": 3.4141, "value": 131.1}, {"ticker": "VIXM", "pct": 0.63, "price": 15.3877, "shares": 2.5852, "value": 39.78}, {"ticker": "$USD", "pct": 0.1, "price": 1.0, "shares": 6.2, "value": 6.2}]}, {"id": "iPifD8uTozTr0sbu9qiB", "name": "BLEE - 187 2026 ALL in One For High Interest Period", "value": 5281.97, "last_rebalance": null, "return_pct": null, "annualized": null, "holdings": [{"ticker": "UPRO", "pct": 1.18, "price": 148.32, "shares": 0.4197, "value": 62.25}, {"ticker": "SDOW", "pct": 2.83, "price": 26.93, "shares": 5.5532, "value": 149.55}, {"ticker": "SVXY", "pct": 2.3, "price": 54.75, "shares": 2.2175, "value": 121.41}, {"ticker": "TECL", "pct": 14.61, "price": 230.14, "shares": 3.3527, "value": 771.58}, {"ticker": "TQQQ", "pct": 15.06, "price": 83.715, "shares": 9.5032, "value": 795.56}, {"ticker": "SHV", "pct": 3.92, "price": 110.355, "shares": 1.8767, "value": 207.1}, {"ticker": "SGOV", "pct": 35.05, "price": 100.65, "shares": 18.395, "value": 1851.45}, {"ticker": "GLD", "pct": 17.16, "price": 412.98, "shares": 2.195, "value": 906.5}, {"ticker": "VGT", "pct": 2.52, "price": 118.9633, "shares": 1.1199, "value": 133.22}, {"ticker": "TMV", "pct": 1.26, "price": 38.3986, "shares": 1.7271, "value": 66.32}, {"ticker": "USMV", "pct": 3.63, "price": 96.35, "shares": 1.991, "value": 191.83}, {"ticker": "VIXM", "pct": 0.38, "price": 15.3877, "shares": 1.3193, "value": 20.3}, {"ticker": "$USD", "pct": 0.09, "price": 1.0, "shares": 4.9, "value": 4.9}]}];
const GENERATED = /* __GENERATED__ */ "2026-05-28";

// ── Chart colours ─────────────────────────────────────────────────────────────
const PALETTE = [
  "#3b82f6","#f59e0b","#10b981","#f87171","#a78bfa",
  "#34d399","#fb923c","#60a5fa","#fbbf24","#4ade80",
  "#e879f9","#38bdf8"
];

const fmt  = n  => n == null ? "—" : "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtP = p  => p == null ? "—" : (p >= 0 ? "+" : "") + p.toFixed(2) + "%";
const today = new Date().toISOString().slice(0,10);

document.getElementById("updated-line").textContent =
  "Data as of " + GENERATED + " · Generated by daily allocation pull";

const list = document.getElementById("sym-list");

SYMPHONIES.forEach((sym, si) => {
  const isToday = sym.last_rebalance === today;
  const retColor = (sym.return_pct == null || sym.return_pct >= 0) ? "var(--green)" : "var(--red)";
  const annColor = (sym.annualized == null || sym.annualized >= 0) ? "var(--green)" : "var(--red)";

  // Sort holdings descending by pct
  const sorted = [...sym.holdings].sort((a,b) => b.pct - a.pct);

  // ── Donut chart data ──
  const labels = sorted.map(h => h.ticker);
  const data   = sorted.map(h => h.pct);
  const colors = sorted.map((_,i) => PALETTE[i % PALETTE.length]);

  // ── Allocation rows ──
  const rows = sorted.map((h, i) => `
    <tr>
      <td><span class="ticker-badge">${h.ticker}</span></td>
      <td class="r" style="font-weight:700;color:${PALETTE[i%PALETTE.length]};">${h.pct.toFixed(1)}%</td>
      <td class="r">
        <div class="bar-wrap">
          <div class="bar-fill" style="width:${Math.min(h.pct,100)}%;background:${PALETTE[i%PALETTE.length]};"></div>
        </div>
      </td>
      <td class="r" style="color:var(--muted);">${fmt(h.price)}</td>
      <td class="r">${h.shares.toFixed(4)}</td>
      <td class="r" style="font-weight:600;">${fmt(h.value)}</td>
    </tr>`).join("");

  const card = document.createElement("div");
  card.className = "sym-card";
  card.innerHTML = `
    <div class="sym-header">
      <div>
        <div class="sym-name">${sym.name}</div>
        <div class="sym-id">${sym.id}</div>
      </div>
      <div class="sym-meta">
        <div class="meta-stat">
          <div class="ml">Portfolio Value</div>
          <div class="mv" style="color:var(--gold);">${fmt(sym.value)}</div>
        </div>
        <div class="meta-stat">
          <div class="ml">Return</div>
          <div class="mv" style="color:${retColor};">${fmtP(sym.return_pct)}</div>
        </div>
        <div class="meta-stat">
          <div class="ml">Annualized</div>
          <div class="mv" style="color:${annColor};font-size:14px;">${fmtP(sym.annualized)}</div>
        </div>
        <div class="meta-stat">
          <div class="ml">Last Rebalance</div>
          <div class="mv" style="font-size:13px;">
            <span class="rebalance-badge ${isToday ? 'badge-today' : 'badge-old'}">
              ${sym.last_rebalance ?? 'Pending'}${isToday ? ' ✓' : ''}
            </span>
          </div>
        </div>
      </div>
    </div>
    <div class="sym-body">
      <div class="chart-col">
        <canvas id="chart-${si}"></canvas>
        <div class="chart-label">Today's Allocation</div>
      </div>
      <div class="table-col">
        <table>
          <thead>
            <tr>
              <th>Ticker</th>
              <th class="r">Weight</th>
              <th class="r">Bar</th>
              <th class="r">Price</th>
              <th class="r">Shares</th>
              <th class="r">Value</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="total-row">
          ${sym.holdings.length} positions &nbsp;&middot;&nbsp; Total: ${fmt(sym.value)}
        </div>
      </div>
    </div>`;
  list.appendChild(card);

  // Draw donut chart
  new Chart(document.getElementById(`chart-${si}`), {
    type: "doughnut",
    data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: "#111827", borderWidth: 2 }] },
    options: {
      cutout: "65%",
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1e293b",
          titleColor: "rgba(255,255,255,0.7)",
          bodyColor: "#fff",
          callbacks: { label: ctx => ` ${ctx.label}: ${ctx.parsed.toFixed(1)}%` }
        }
      }
    }
  });
});
</script>
</body>
</html>
