<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BLEE Quant — Symphony Watch</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0b1120; --card: #111827; --card2: #131f35;
    --text: #f1f5f9; --muted: #94a3b8; --border: #1f2937;
    --gold: #f59e0b; --green: #4ade80; --red: #f87171; --blue: #60a5fa;
    --shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }

  /* ── Access tier note (change BLEE_REQUIRED_TIER below to open to more users) ── */

  .page-header {
    background: linear-gradient(135deg, #0d1829 0%, #111827 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 32px 24px;
  }
  .page-header h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .page-header h1 span { color: var(--gold); }
  .page-header .sub {
    color: var(--muted); font-size: 13px; margin-top: 5px;
  }
  .page-header .updated {
    font-size: 11px; color: #475569; margin-top: 4px;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; }

  /* ── Symphony card ── */
  .sym-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 28px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .sym-header {
    background: var(--card2); padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: flex-start; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .sym-name { font-size: 15px; font-weight: 700; line-height: 1.4; max-width: 600px; }
  .sym-id   { font-size: 10px; color: #475569; font-family: monospace; margin-top: 3px; }
  .sym-meta { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
  .meta-stat { text-align: right; }
  .meta-stat .ml { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .meta-stat .mv { font-size: 18px; font-weight: 800; }

  .sym-body {
    display: grid; grid-template-columns: 220px 1fr;
    gap: 0;
  }
  @media (max-width: 720px) {
    .sym-body { grid-template-columns: 1fr; }
    .chart-col { border-right: none; border-bottom: 1px solid var(--border); }
  }

  .chart-col {
    padding: 20px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .chart-col canvas { max-width: 180px; max-height: 180px; }
  .chart-label { font-size: 11px; color: var(--muted); margin-top: 10px; text-align: center; }

  .table-col { padding: 0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead tr { background: rgba(255,255,255,0.03); }
  th {
    padding: 10px 16px; text-align: left; font-size: 10px;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em;
    border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  th.r, td.r { text-align: right; }
  td { padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.04); }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: rgba(255,255,255,0.025); }
  .ticker-badge {
    display: inline-block; background: rgba(96,165,250,0.15);
    color: var(--blue); padding: 2px 8px; border-radius: 5px;
    font-weight: 700; font-size: 12px; letter-spacing: 0.04em;
  }
  .bar-wrap { position: relative; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; min-width: 80px; }
  .bar-fill  { height: 100%; border-radius: 3px; }

  .rebalance-badge {
    display: inline-block; font-size: 11px; padding: 2px 8px;
    border-radius: 5px; font-weight: 600;
  }
  .badge-today { background: rgba(74,222,128,0.15); color: var(--green); }
  .badge-old   { background: rgba(148,163,184,0.1);  color: var(--muted); }

  .section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.1em; color: var(--muted); margin-bottom: 16px;
  }
  .total-row { font-size: 13px; color: var(--muted); padding: 8px 24px 16px; }

  /* ── Live account balance banner ── */
  .live-balance-bar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    background: rgba(16,185,129,0.08); border: 1px solid rgba(16,185,129,0.20);
    border-radius: 10px; padding: 10px 20px; margin-top: 14px;
  }
  .live-balance-bar .lb-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); font-weight: 600;
  }
  .live-balance-bar .lb-value {
    font-size: 22px; font-weight: 900; color: var(--green);
    letter-spacing: -0.02em;
  }
  .live-balance-bar .lb-value.lb-err { color: var(--muted); font-size: 14px; font-weight: 400; }
  .live-balance-bar .lb-meta {
    font-size: 11px; color: #475569; margin-left: auto;
  }
  .live-balance-bar .lb-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
    display: inline-block; margin-right: 5px;
  }
  .live-balance-bar .lb-dot.live { background: var(--green); animation: pulse-dot 2s infinite; }
  @keyframes pulse-dot {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }
  }
</style>

// ── Live Composer account balance — reads from Firebase Firestore ─────────────
(function () {
  const elVal    = document.getElementById("lb-value");
  const elStatus = document.getElementById("lb-status");
  const elDot    = document.getElementById("lb-dot");

  function fmtMoney(n) {
    return "$" + Number(n).toLocaleString("en-US",
      { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function isMarketOpen() {
    const et  = new Date(new Date().toLocaleString("en-US", { timeZone: "America/New_York" }));
    const day = et.getDay();
    if (day === 0 || day === 6) return false;
    const mins = et.getHours() * 60 + et.getMinutes();
    return mins >= 9 * 60 + 30 && mins < 16 * 60;
  }

  function showFallback() {
    const total = (typeof ACCOUNT_TOTAL === "number" && ACCOUNT_TOTAL > 0)
      ? ACCOUNT_TOTAL
      : SYMPHONIES.reduce(function(s, x) { return s + (x.value || 0); }, 0);
    elVal.className   = "lb-value";
    elVal.textContent = fmtMoney(total);
    elDot.className   = "lb-dot";
    elStatus.textContent = "As of " + GENERATED + " (live updater offline)";
  }

  showFallback();  // show immediately while Firestore loads

  function attachFirestoreListener() {
    try {
      const db  = firebase.firestore();
      const ref = db.collection("account").doc("balance");

      ref.onSnapshot(function(snap) {
        if (!snap.exists) { showFallback(); return; }
        const data  = snap.data();
        const total = data.total;
        const updAt = data.updated_at || "";
        if (typeof total !== "number" || total <= 0) { showFallback(); return; }

        elVal.className   = "lb-value";
        elVal.textContent = fmtMoney(total);
        elDot.className   = "lb-dot live";

        let timeStr = "";
        if (updAt) {
          try {
            timeStr = new Date(updAt).toLocaleTimeString("en-US",
              { hour: "2-digit", minute: "2-digit", timeZone: "America/New_York" }) + " ET";
          } catch(e) {}
        }
        const mktLabel = isMarketOpen()
          ? "market open · updates every 5 min" : "market closed";
        elStatus.textContent = "Live" + (timeStr ? " · updated " + timeStr : "")
          + " · " + mktLabel;

      }, function(err) {
        console.warn("Firestore balance listener:", err.message);
        showFallback();
        elStatus.textContent = "As of " + GENERATED
          + " — set Firestore rule to enable live updates";
      });
    } catch(e) {
      showFallback();
    }
  }

  // Wait for Firebase app to initialise (loaded via firebase-config.js)
  var _tries = 0;
  var _wait = setInterval(function() {
    _tries++;
    if (typeof firebase !== "undefined" && firebase.apps && firebase.apps.length > 0) {
      clearInterval(_wait);
      attachFirestoreListener();
    } else if (_tries > 40) {
      clearInterval(_wait);
      showFallback();
    }
  }, 100);
})();
</script>
